<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ATM Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="atm-container">

        <h1>🏦 ATM LOGIN</h1>

        <p>Welcome back</p>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <p class="{{ category }}">
                        {{ message }}
                    </p>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Login Form -->

        <form method="POST">

            <div class="form-group">

                <label for="card_number">
                    Card Number
                </label>

                <input
                    type="text"
                    id="card_number"
                    name="card_number"
                    placeholder="Enter card number"
                    maxlength="16"
                    required
                >

            </div>


            <div class="form-group">

                <label for="pin">
                    PIN
                </label>

                <input
                    type="password"
                    id="pin"
                    name="pin"
                    placeholder="Enter PIN"
                    maxlength="4"
                    required
                >

            </div>


            <button type="submit">
                Login
            </button>

        </form>


        <div class="signup-link">

            <p>Don't have an account?</p>

            <a href="{{ url_for('signup') }}">
                Create New Account
            </a>

        </div>

    </div>

</body>

</html>
