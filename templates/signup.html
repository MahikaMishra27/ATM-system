<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - ATM</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="atm-container signup-container">

        <h1>🏦 Create Account</h1>

        <p class="signup-subtitle">
            Create your new ATM account
        </p>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <p class="{{ category }}">
                        {{ message }}
                    </p>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Signup Form -->

        <form method="POST">

            <!-- Full Name -->

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Phone -->

            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your 10-digit phone number"
                    maxlength="10"
                    required
                >

            </div>


            <!-- PIN -->

            <div class="form-group">

                <label for="pin">
                    Create 4-Digit PIN
                </label>

                <input
                    type="password"
                    id="pin"
                    name="pin"
                    placeholder="Enter 4-digit PIN"
                    maxlength="4"
                    minlength="4"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- Confirm PIN -->

            <div class="form-group">

                <label for="confirm_pin">
                    Confirm PIN
                </label>

                <input
                    type="password"
                    id="confirm_pin"
                    name="confirm_pin"
                    placeholder="Confirm your PIN"
                    maxlength="4"
                    minlength="4"
                    inputmode="numeric"
                    required
                >

            </div>


            <!-- Create Account -->

            <button
                type="submit"
                class="signup-button"
            >
                Create Account
            </button>

        </form>


        <!-- Login -->

        <div class="login-link">

            <p>
                Already have an account?
            </p>

            <a
                href="{{ url_for('login') }}"
                class="login-button"
            >
                Login
            </a>

        </div>

    </div>

</body>

</html>
