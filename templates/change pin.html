<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Change PIN - ATM</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="atm-container">

        <h1>🔐 Change PIN</h1>

        <p>Change your ATM PIN securely.</p>


        <!-- Flash Messages -->

        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <p class="{{ category }}">
                        {{ message }}
                    </p>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- Change PIN Form -->

        <form method="POST">

            <label for="current_pin">
                Current PIN
            </label>

            <br>

            <input
                type="password"
                id="current_pin"
                name="current_pin"
                maxlength="4"
                minlength="4"
                inputmode="numeric"
                placeholder="Enter current PIN"
                required
            >

            <br><br>


            <label for="new_pin">
                New PIN
            </label>

            <br>

            <input
                type="password"
                id="new_pin"
                name="new_pin"
                maxlength="4"
                minlength="4"
                inputmode="numeric"
                placeholder="Enter new PIN"
                required
            >

            <br><br>


            <label for="confirm_pin">
                Confirm New PIN
            </label>

            <br>

            <input
                type="password"
                id="confirm_pin"
                name="confirm_pin"
                maxlength="4"
                minlength="4"
                inputmode="numeric"
                placeholder="Confirm new PIN"
                required
            >

            <br><br>


            <button type="submit">
                Change PIN
            </button>

        </form>


        <br>


        <!-- Back to Dashboard -->

        <a
            href="{{ url_for('dashboard') }}"
            class="atm-button"
        >
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
